title: Francisca
views:
  - title: Francisca
    path: francisca
    icon: mdi:robot-vacuum
    type: masonry
    cards:
      - type: picture-entity
        entity: camera.francisca_map
        name: Mapa
        show_name: false
        show_state: false
        camera_view: auto
        aspect_ratio: "73%"

      - type: vacuum
        entity: vacuum.francisca

      - type: glance
        title: Estado
        columns: 3
        state_color: true
        entities:
          - entity: sensor.francisca_battery
            name: Batería
          - entity: sensor.francisca_status
            name: Estado
          - entity: sensor.francisca_suction
            name: Succión
          - entity: sensor.francisca_volume
            name: Volumen
          - entity: sensor.francisca_cleaning_area
            name: Área
          - entity: sensor.francisca_error_code
            name: Error

      - type: entities
        title: Ajustes
        entities:
          - entity: number.francisca_volume
            name: Volumen
          - entity: switch.francisca_auto_boost
            name: Auto boost
          - entity: select.francisca_mop_mode
            name: Modo mopa
          - entity: select.francisca_pad_wetness
            name: Humedad mopa

      - type: grid
        title: Limpiar habitación
        columns: 2
        square: false
        cards:
          - type: button
            name: Room 1
            icon: mdi:floor-plan
            tap_action:
              action: perform-action
              perform_action: botslab_vacuum.clean_rooms
              target:
                entity_id: vacuum.francisca
              data:
                room_ids: [0]
          - type: button
            name: Room 2
            icon: mdi:floor-plan
            tap_action:
              action: perform-action
              perform_action: botslab_vacuum.clean_rooms
              target:
                entity_id: vacuum.francisca
              data:
                room_ids: [1]
          - type: button
            name: Room 3
            icon: mdi:floor-plan
            tap_action:
              action: perform-action
              perform_action: botslab_vacuum.clean_rooms
              target:
                entity_id: vacuum.francisca
              data:
                room_ids: [2]
          - type: button
            name: Room 4
            icon: mdi:floor-plan
            tap_action:
              action: perform-action
              perform_action: botslab_vacuum.clean_rooms
              target:
                entity_id: vacuum.francisca
              data:
                room_ids: [3]
          - type: button
            name: Room 5
            icon: mdi:floor-plan
            tap_action:
              action: perform-action
              perform_action: botslab_vacuum.clean_rooms
              target:
                entity_id: vacuum.francisca
              data:
                room_ids: [4]
          - type: button
            name: Room 6
            icon: mdi:floor-plan
            tap_action:
              action: perform-action
              perform_action: botslab_vacuum.clean_rooms
              target:
                entity_id: vacuum.francisca
              data:
                room_ids: [5]
          - type: button
            name: Room 7
            icon: mdi:floor-plan
            tap_action:
              action: perform-action
              perform_action: botslab_vacuum.clean_rooms
              target:
                entity_id: vacuum.francisca
              data:
                room_ids: [6]

      - type: gauge
        entity: sensor.francisca_battery
        name: Batería
        unit: "%"
        min: 0
        max: 100
        needle: true
        severity:
          red: 0
          yellow: 20
          green: 50

      - type: markdown
        title: Programación
        content: >
          Crea horarios con **Ajustes para desarrolladores → Acciones →
          `botslab_vacuum.set_schedule`** (hora, días, habitaciones en orden,
          succión max/quiet, pasadas). Las habitaciones disponibles están en el
          atributo `rooms` de `vacuum.francisca`.

      - type: history-graph
        title: Actividad (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.francisca_status
            name: Estado
          - entity: sensor.francisca_battery
            name: Batería
